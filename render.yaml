services:
  - type: web
    name: flowdirector
    runtime: python
    buildCommand: "pip install -r agents/requirements.txt"
    startCommand: "python -m uvicorn agents.src.main:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GROQ_API_KEY
        sync: false
  - type: web
    name: flowdirector-server
    runtime: node
    buildCommand: "npm install"
    startCommand: "node server/src/index.js"
    envVars:
      - key: PORT
        value: 5000
      - key: ENVIRONMENT
        value: production
  - type: static
    name: flowdirector-frontend
    buildCommand: "npm run build"
    staticPublishPath: ./client/dist
